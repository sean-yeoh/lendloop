# Checks every push and pull request: formatting, types, lint, the Convex tests, and a
# production build. The tests run against convex-test's in-memory backend, so no Convex
# deployment, Clerk app, or n8n is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # next build prerenders pages, so it needs these public values. They are placeholders that
      # point nowhere: no secret is used, and the build makes no calls to Clerk or Convex.
      - run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          # "pk_test_" + base64("example.clerk.accounts.dev$"), the format Clerk expects.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
